<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SEC Survivor Pool</title>
<link rel="stylesheet" href="css/style.css?v=35">
</head>
<body>
<div id="app"><p id="bootPlaceholder" class="muted" style="padding:2rem;text-align:center;">Loading…</p></div>

<script>
// Self-diagnosing boot watchdog — see admin.html for the full story. If
// nothing has replaced #bootPlaceholder within a few seconds, something
// failed silently and we'd otherwise have zero visibility into why on a
// phone with no devtools handy.
(function () {
  var events = [];
  function log(msg) { events.push(new Date().toISOString().slice(11, 19) + '  ' + msg); }
  // Exposed so the module code can record which boot STAGE it reached — a
  // silent hang has no error to capture, so the stage timeline is the only
  // thing that actually localizes it. See admin.html.
  window.__bootLog = log;
  window.__bootEvents = events; // readable from a console for live debugging
  window.addEventListener('error', function (e) {
    log('error: ' + (e.message || 'resource failed to load') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
  }, true); // capture phase — script/resource load failures don't bubble
  window.addEventListener('unhandledrejection', function (e) {
    log('unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  setTimeout(function () {
    if (!document.getElementById('bootPlaceholder')) return; // something rendered — all good
    var lines = [
      'Still on "Loading…" after 6s.',
      '',
      'User agent: ' + navigator.userAgent,
      'Online: ' + navigator.onLine,
      'firebase global present: ' + (typeof firebase !== 'undefined'),
      '',
      events.length ? 'Boot timeline (last stage reached = where it stalled):' : 'Nothing logged at all — the module never started.',
    ].concat(events);
    document.getElementById('app').innerHTML =
      '<pre style="padding:1rem;font-size:0.7rem;white-space:pre-wrap;color:#f66;">' +
      lines.join('\n').replace(/</g, '&lt;') +
      '</pre><p style="text-align:center;padding:0 1rem;" class="muted">Screenshot this and send it back.</p>';
  }, 9000);
})();
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="js/firebase-config.js?v=35"></script>
<script type="module" src="js/app.js?v=35"></script>
</body>
</html>
